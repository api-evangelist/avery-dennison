  the atma.io connected product cloud (docs.atma.io redirects there with audience
  https://open.atma.io). /.well-known/openid-configuration and /.well-known/oauth-authorization-server
  return the same OIDC provider metadata (issuer https://login.atma.io/, PKCE S256, device-code and
  dynamic client registration endpoints). Nothing is served on the corporate hosts: averydennison.com
  301s every path to www, and www.averydennison.com, developer.averydennison.com and
  rfid.averydennison.com 404 every path. www.atma.io is a Wix origin that answers every /.well-known/*
  path with HTTP 400 and an HTML error body — a catch-all, not a document. docs.atma.io 302s every path
  to the Auth0 login, and open.atma.io (the API host) returns a JSON 404 for every path.
