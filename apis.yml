description: >-
  Avery Dennison is a global materials science and manufacturing company specializing in the design
  and manufacture of labeling and functional materials, packaging, and intelligent labels. Its RFID
  and digital-identification business runs atma.io, a connected product cloud that assigns digital
  IDs to physical items and underpins its Digital Product Passport offering; the atma.io API is
  gated behind an OAuth 2.0 login and no public contract is published.
