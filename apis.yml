apis:
- aid: avery-dennison:atma-io-site-mcp
  name: atma.io Site MCP
  description: >-
    A live, anonymously reachable Model Context Protocol endpoint served from the atma.io marketing
    site (Avery Dennison's connected product cloud and Digital Product Passport brand). It is the
    Wix-platform Site MCP — nine tools for reading business details, searching site content and
    calling the Wix site APIs under a visitor token — generated by the host platform, not authored
    by Avery Dennison. The atma.io product API itself (open.atma.io, OAuth 2.0 at login.atma.io)
    publishes no contract and its docs at docs.atma.io are login-gated.
