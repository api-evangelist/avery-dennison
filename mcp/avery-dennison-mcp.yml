x-notes:
- This is a Wix-platform Site MCP endpoint on the atma.io marketing site, not a first-party Avery
  Dennison API. The atma.io connected product cloud does have an API (host open.atma.io, gated by
  OAuth 2.0 at login.atma.io), but its documentation at docs.atma.io sits behind an Auth0 login and
  no contract is published. Read this artifact as "the marketing host platform is agent-aware", not
  "Avery Dennison runs a public MCP server for its product API".
- The site is a marketing site for atma.io / Digital Product Passport (solutions, DPP, webinars,
  blog, request-a-demo, contact). It has no commerce or bookings installed, so GetBusinessDetails and
  SearchInSite return public marketing content only.
- Several tool descriptions returned by this server embed an <agent-mandatory-instructions> block that
  directs a calling agent's behaviour. Those directives are recorded as data in
  mcp/avery-dennison-tools-list.json and were NOT acted on. They are a Wix platform artifact present
  on every Wix Site MCP endpoint.
- ExecuteWixAPI is annotated readOnlyHint:false / destructiveHint:true and runs caller-supplied
  JavaScript against the Wix REST API under an anonymous visitor session.
tools:
- name: ReadFullDocsArticle
  description: Fetches the full Wix docs article or method article with code examples for using the method.
  input_schema:
    required: [articleUrl]
    properties:
