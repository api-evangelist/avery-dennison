      type: string
  annotations: {readOnlyHint: true, destructiveHint: false, openWorldHint: false}
- name: ReadFullDocsMethodSchema
  description: Fetches the full method schema for a given Wix API method (request/response shape).
  input_schema:
    required: [articleUrl, reason]
    properties:
    - name: articleUrl
      type: string
    - name: reason
      type: string
  annotations: {readOnlyHint: true, destructiveHint: false, openWorldHint: false}
- name: BrowseWixRESTDocsMenu
  description: Browse the Wix REST API documentation menu hierarchy.
  input_schema:
